name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: '1.1.0'
        type: string
      build_run_id:
        description: Successful Desktop packages run
        required: true
        default: '41709297581'
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'simfonyy/aureon' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Verify build source and artifacts
        id: prepare
        run: node scripts/publish-release.mjs prepare
      - name: Download Windows packages
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ steps.prepare.outputs.windows_id }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: release-input/windows
          merge-multiple: true
      - name: Download Linux packages
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ steps.prepare.outputs.linux_id }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: release-input/linux
          merge-multiple: true
      - name: Verify packages and publish release
        run: node scripts/publish-release.mjs publish
